<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bottle — Know what to do with it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14150F;
    --surface: #1D2016;
    --surface-2: #262A1D;
    --line: #34382A;
    --gold: #C9A24B;
    --gold-dim: #8A7332;
    --wine: #8C2A3A;
    --wine-bright: #B8394D;
    --green-ok: #6E9265;
    --text: #ECE6D6;
    --text-muted: #93927F;
    --text-faint: #5E5D4E;
    --radius: 14px;
    --serif: 'Fraunces', serif;
    --sans: 'Inter', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(120% 140% at 50% -10%, #1B1E13 0%, var(--bg) 55%);
    color: var(--text);
    font-family: var(--sans);
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  /* ---------- top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 22px 14px;
  }
  .wordmark{
    font-family: var(--serif);
    font-weight:600;
    font-size:22px;
    letter-spacing:0.5px;
    color:var(--text);
  }
  .wordmark span{ color: var(--gold); }
  .tagline{
    font-size:10.5px;
    color:var(--text-faint);
    font-family: var(--mono);
    letter-spacing:0.6px;
    text-transform:uppercase;
    margin-top:2px;
  }
  /* ---------- main scroll area ---------- */
  main{
    flex:1;
    padding: 4px 22px 110px;
    overflow-y:auto;
  }
  .view{ animation: fadeIn .35s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-family:var(--sans);
    font-weight:600;
    font-size:14.5px;
    border-radius:999px;
    border:1px solid transparent;
    padding:13px 22px;
    cursor:pointer;
    transition: transform .15s ease, opacity .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{ background: var(--gold); color:#191A11; }
  .btn-primary:hover{ opacity:.92; }
  .btn-ghost{ background:transparent; border-color: var(--line); color:var(--text); }
  .btn-ghost:hover{ border-color: var(--gold-dim); }
  .btn-wine{ background: var(--wine); color:#F3E4E4; }
  .btn-block{ width:100%; }
  .btn-sm{ padding:8px 14px; font-size:12.5px; }

  /* ---------- scan hero ---------- */
  .scan-hero{
    margin-top:18px;
    border:1px solid var(--line);
    border-radius: 20px;
    padding: 30px 22px 26px;
    background: linear-gradient(165deg, var(--surface) 0%, #191B12 100%);
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .scan-hero::before{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(115deg, rgba(201,162,75,0.035) 0 2px, transparent 2px 26px);
    pointer-events:none;
  }
  .scan-hero h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:26px;
    line-height:1.25;
    margin-bottom:8px;
    position:relative;
  }
  .scan-hero p{
    color:var(--text-muted);
    font-size:13.5px;
    line-height:1.5;
    max-width:320px;
    margin:0 auto 22px;
    position:relative;
  }
  .scan-btn{
    width:84px; height:84px;
    border-radius:50%;
    background: var(--gold);
    display:flex; align-items:center; justify-content:center;
    margin: 0 auto 14px;
    cursor:pointer;
    border:none;
    position:relative;
    box-shadow: 0 0 0 6px rgba(201,162,75,0.1), 0 10px 30px -6px rgba(201,162,75,0.35);
    transition: transform .15s ease;
  }
  .scan-btn:active{ transform: scale(0.94); }
  .scan-btn svg{ width:32px; height:32px; }
  .scan-cta-label{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color: var(--gold);
    position:relative;
  }

  /* ---------- stat row ---------- */
  .stat-row{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .stat-card{
    flex:1;
    background: var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 12px;
    text-align:center;
  }
  .stat-num{ font-family:var(--serif); font-size:22px; font-weight:600; }
  .stat-label{ font-size:10px; color:var(--text-faint); font-family:var(--mono); text-transform:uppercase; letter-spacing:.5px; margin-top:2px;}

  /* ---------- section heading ---------- */
  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin: 30px 0 12px;
  }
  .section-head h2{
    font-family:var(--serif);
    font-size:16.5px;
    font-weight:600;
  }
  .section-head a{ font-size:12px; color:var(--gold-dim); cursor:pointer; font-family:var(--mono); }

  /* ---------- mini bottle card (drink soon / cellar list) ---------- */
  .bottle-card{
    display:flex;
    gap:12px;
    align-items:center;
    background: var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px;
    margin-bottom:10px;
    cursor:pointer;
    transition: border-color .15s ease;
  }
  .bottle-card:hover{ border-color: var(--gold-dim); }
  .bottle-thumb{
    width:44px; height:58px;
    border-radius:6px;
    background: linear-gradient(180deg, var(--gold-dim), #4b3f1a);
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
  }
  .bottle-info{ flex:1; min-width:0; }
  .bottle-name{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bottle-sub{ font-size:11.5px; color:var(--text-muted); margin-top:2px; font-family:var(--mono); }
  .status-chip{
    font-size:9.5px;
    font-family:var(--mono);
    text-transform:uppercase;
    letter-spacing:.4px;
    padding:3px 8px;
    border-radius:999px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .chip-unopened{ background:rgba(110,146,101,0.15); color:var(--green-ok); }
  .chip-opened{ background:rgba(201,162,75,0.15); color:var(--gold); }
  .chip-finished, .chip-gifted, .chip-sold{ background:rgba(147,146,127,0.15); color:var(--text-muted); }

  .empty-state{
    text-align:center;
    padding: 30px 10px;
    color: var(--text-faint);
    font-size:13px;
    line-height:1.6;
  }

  /* ---------- loading / scanning view ---------- */
  .loading-view{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding-top:70px;
    text-align:center;
  }
  .loading-ring{
    width:70px; height:70px;
    border-radius:50%;
    border:2px solid var(--line);
    border-top-color: var(--gold);
    animation: spin 1s linear infinite;
    margin-bottom:24px;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .loading-text{ font-family:var(--mono); font-size:12.5px; color:var(--text-muted); letter-spacing:.4px; min-height:18px; }
  .preview-thumb{
    width:120px; height:160px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:26px;
    border:1px solid var(--line);
    opacity:.85;
  }

  /* ---------- label card (result) ---------- */
  .label-card{
    margin-top:14px;
    border-radius:18px;
    border:1px solid var(--line);
    background: linear-gradient(180deg, var(--surface) 0%, #171911 100%);
    padding:26px 22px 22px;
    position:relative;
    overflow:hidden;
  }
  .label-card::after{
    content:"";
    position:absolute; left:0; right:0; top:0; height:3px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .confidence-seal{
    position:absolute;
    top:18px; right:18px;
    width:58px; height:58px;
    border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:var(--mono);
    border: 2px solid currentColor;
  }
  .seal-high{ color: var(--green-ok); }
  .seal-medium{ color: var(--gold); }
  .seal-low{ color: var(--wine-bright); }
  .seal-pct{ font-size:15px; font-weight:600; line-height:1; }
  .seal-label{ font-size:7px; letter-spacing:.5px; text-transform:uppercase; margin-top:2px; }

  .label-eyebrow{ font-family:var(--mono); font-size:10.5px; color:var(--gold-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px;}
  .label-name{ font-family:var(--serif); font-size:24px; font-weight:600; line-height:1.2; max-width:76%; margin-bottom:4px;}
  .label-sub{ font-size:13px; color:var(--text-muted); max-width:76%; margin-bottom:16px;}
  .label-facts{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 16px;
    padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .fact-label{ font-family:var(--mono); font-size:9.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.5px; }
  .fact-value{ font-family:var(--mono); font-size:13px; color:var(--text); margin-top:2px; }
  .label-note{
    margin-top:16px;
    font-size:12px;
    color:var(--text-faint);
    line-height:1.6;
    font-style:italic;
    border-top:1px dashed var(--line);
    padding-top:12px;
  }

  /* ---------- radar chart ---------- */
  .radar-wrap{
    margin-top:16px;
    background: var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px 16px;
    display:flex; flex-direction:column; align-items:center;
  }
  .radar-wrap h3{ font-family:var(--serif); font-size:15px; font-weight:600; align-self:flex-start; margin-bottom:12px;}
  .radar-legend{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:6px 14px;
    width:100%;
    margin-top:14px;
  }
  .legend-row{ display:flex; align-items:center; justify-content:space-between; font-size:11.5px; }
  .legend-row .dim{ color:var(--text-muted); }
  .legend-row .val{ font-family:var(--mono); color:var(--gold); }

  /* ---------- recommendation ---------- */
  .rec-card{
    margin-top:16px;
    background: var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px 18px 6px;
  }
  .rec-card h3{ font-family:var(--serif); font-size:15px; font-weight:600; margin-bottom:4px;}
  .rec-reason{ font-size:12.5px; color:var(--text-muted); line-height:1.55; margin-bottom:14px; }
  .action-item{
    display:flex; align-items:center; gap:12px;
    padding:12px 0;
    border-top:1px solid var(--line);
  }
  .action-rank{ font-family:var(--serif); font-size:18px; color:var(--gold); width:20px; flex-shrink:0; }
  .action-icon{ font-size:20px; flex-shrink:0; }
  .action-body{ flex:1; }
  .action-title{ font-size:13.5px; font-weight:600; text-transform:capitalize; }
  .action-reason{ font-size:11.5px; color:var(--text-faint); margin-top:2px; }

  /* ---------- storage / pairing ---------- */
  .info-block{
    margin-top:16px;
    background: var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px;
  }
  .info-block h3{ font-family:var(--serif); font-size:15px; font-weight:600; margin-bottom:10px;}
  .storage-row{ display:flex; gap:10px; margin-bottom:8px; }
  .storage-tag{ font-family:var(--mono); font-size:10px; text-transform:uppercase; color:var(--gold); flex-shrink:0; width:70px; padding-top:1px;}
  .storage-desc{ font-size:12.5px; color:var(--text-muted); line-height:1.5; }
  .pairing-pill{
    display:inline-block;
    font-size:12px;
    padding:7px 13px;
    border-radius:999px;
    border:1px solid var(--line);
    color:var(--text-muted);
    margin:0 6px 8px 0;
  }

  .result-actions{ display:flex; gap:10px; margin-top:20px; }

  /* ---------- tabs (cellar) ---------- */
  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-bottom:16px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    font-family:var(--mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.4px;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    color:var(--text-muted);
    white-space:nowrap;
    cursor:pointer;
    flex-shrink:0;
  }
  .tab.active{ background:var(--gold); border-color:var(--gold); color:#191A11; font-weight:600; }

  /* ---------- detail status bar ---------- */
  .status-actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
  .status-btn{
    font-family:var(--mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.4px;
    padding:9px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    color:var(--text-muted);
    cursor:pointer;
    background:transparent;
  }
  .status-btn.active{ border-color:var(--gold); color:var(--gold); }

  .back-row{
    display:flex; align-items:center; gap:10px;
    margin-bottom:10px;
    cursor:pointer;
    color:var(--text-muted);
    font-size:13px;
  }
  .back-row:hover{ color: var(--text); }

  /* ---------- bottom nav ---------- */
  .bottomnav{
    position:fixed;
    bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px;
    display:flex;
    background: rgba(20,21,15,0.92);
    backdrop-filter: blur(10px);
    border-top:1px solid var(--line);
    padding: 10px 18px calc(10px + env(safe-area-inset-bottom));
  }
  .navbtn{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; cursor:pointer;
    color:var(--text-faint);
    font-family:var(--mono);
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:.5px;
  }
  .navbtn.active{ color: var(--gold); }
  .navbtn svg{ width:20px; height:20px; }

  .icon-btn{
    width:36px; height:36px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--text-muted);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .icon-btn svg{ width:17px; height:17px; }
  .icon-btn:hover{ color:var(--gold); border-color:var(--gold-dim); }

  .star-row{ display:flex; gap:8px; margin-top:10px; }
  .star-btn{
    background:none; border:none; cursor:pointer;
    font-size:24px; line-height:1; padding:0;
    color: var(--line);
    filter: grayscale(1);
    opacity:.5;
    transition: all .1s ease;
  }
  .star-btn.filled{ color: var(--gold); filter:none; opacity:1; }

  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:12px;
  }
  .toggle-title{ font-size:13.5px; font-weight:600; }
  .toggle-desc{ font-size:11.5px; color:var(--text-faint); margin-top:2px; max-width:230px; }
  .switch{ position:relative; width:42px; height:24px; flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{
    position:absolute; cursor:pointer; inset:0;
    background: var(--line); border-radius:999px; transition:.2s;
  }
  .slider::before{
    content:""; position:absolute; height:18px; width:18px; left:3px; top:3px;
    background:var(--text); border-radius:50%; transition:.2s;
  }
  .switch input:checked + .slider{ background: var(--gold); }
  .switch input:checked + .slider::before{ transform: translateX(18px); background:#191A11; }

  .similarity-badge{
    font-family:var(--mono); font-size:10.5px; color:var(--gold);
    background: rgba(201,162,75,0.12); border-radius:999px; padding:3px 9px;
    flex-shrink:0;
  }

  .rating-display{ font-size:13px; color:var(--gold); font-family:var(--mono); margin-top:6px; }

  input[type=file]{ display:none; }

  .error-box{
    background: rgba(140,42,58,0.12);
    border:1px solid var(--wine);
    color:#E8B9C0;
    border-radius:12px;
    padding:14px 16px;
    font-size:12.5px;
    line-height:1.5;
    margin-top:16px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div>
      <div class="wordmark">BOTTLE<span>.</span></div>
      <div class="tagline">know what to do with it</div>
    </div>
    <button class="icon-btn" onclick="renderSettings()" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
    </button>
  </div>

  <main id="main"></main>

  <nav class="bottomnav">
    <button class="navbtn" id="nav-home" onclick="goHome()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/></svg>
      Home
    </button>
    <button class="navbtn" id="nav-cellar" onclick="renderCellar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 3v18M15 3v18"/></svg>
      Cellar
    </button>
    <button class="navbtn" id="nav-discover" onclick="renderDiscover()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      Discover
    </button>
  </nav>
</div>

<input type="file" id="fileInput" accept="image/*" capture="environment">

<script>
/* ---------------- State ---------------- */
let cellar = [];
let currentScan = null;
let currentDetailId = null;

const DIM_LABELS = {
  mv: "Market Value", ql: "Quality", dv: "Drinking Value", pv: "Pairing Value",
  sv: "Social Value", gv: "Gift Value", cv: "Collecting Value", sto: "Storage Value"
};
const ACTION_ICONS = { drink:"🥃", pair:"🍽️", share:"👥", gift:"🎁", collect:"💎", sell:"💰", store:"🌡️", keep:"💎" };
const FLAVOR_LABELS = { fruit:"Fruit", sweet:"Sweetness", oak:"Oak", smoke:"Smoke", acid:"Acidity", body:"Body" };
let settings = { shareCellar: false };

/* ---------------- Storage ---------------- */
async function loadCellar(){
  try{
    const res = await window.storage.get('cellar', false);
    cellar = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    cellar = [];
  }
}
async function saveCellar(){
  try{
    await window.storage.set('cellar', JSON.stringify(cellar), false);
  }catch(e){
    console.error('save failed', e);
  }
}
async function loadSettings(){
  try{
    const res = await window.storage.get('settings', false);
    settings = res && res.value ? JSON.parse(res.value) : { shareCellar:false };
  }catch(e){
    settings = { shareCellar:false };
  }
}
async function saveSettings(){
  try{ await window.storage.set('settings', JSON.stringify(settings), false); }
  catch(e){ console.error('settings save failed', e); }
}

/* ---------------- Navigation ---------------- */
function setActiveNav(id){
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));
  const el = document.getElementById(id);
  if(el) el.classList.add('active');
}

function goHome(){ setActiveNav('nav-home'); renderHome(); }

/* ---------------- Home ---------------- */
function renderHome(){

function bottleCardHtml(b){
  const id = b.identification || {};
  const name = id.name || id.producer || '未知酒款';
  const sub = [id.category, id.vintage].filter(Boolean).join(' · ') || '—';
  return `
    <div class="bottle-card" onclick="renderDetail('${b.id}')">
      <div class="bottle-thumb">${categoryEmoji(id.category)}</div>
      <div class="bottle-info">
        <div class="bottle-name">${escapeHtml(name)}</div>
        <div class="bottle-sub">${escapeHtml(sub)}</div>
      </div>
      <div class="status-chip chip-${b.status}">${b.status}</div>
    </div>
  `;
}

function categoryEmoji(cat){
  const c = (cat||'').toLowerCase();
  if(c.includes('whisky')||c.includes('whiskey')) return '🥃';
  if(c.includes('wine')) return '🍷';
  if(c.includes('champagne')||c.includes('sparkl')) return '🍾';
  if(c.includes('sake')) return '🍶';
  if(c.includes('rum')) return '🥃';
  return '🍷';
}

/* ---------------- File input -> scan ---------------- */
document.getElementById('fileInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  e.target.value = '';
  const dataUrl = await fileToDataUrl(file);
  await runScan(dataUrl);
});

function fileToDataUrl(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.onerror = ()=> reject(new Error('read failed'));
    r.readAsDataURL(file);
  });
}

async function runScan(dataUrl){
  renderLoading(dataUrl);
  const messages = ["正在辨識酒標...", "正在比對資料...", "正在計算價值地圖...", "正在生成建議..."];
  let mi = 0;
  const loadingInterval = setInterval(()=>{
    mi = (mi+1) % messages.length;
    const el = document.getElementById('loading-text');
    if(el) el.textContent = messages[mi];
  }, 1400);

  try{
    const [header, base64Data] = dataUrl.split(',');
    const mediaType = header.match(/data:(.*);base64/)[1];

    const prompt = `你係一個酒類識別同決策顧問 AI。睇呢張酒標/酒瓶相片,盡你所知判斷呢係咩酒,並提供價值評估同建議。

規則:
- 只根據圖片可見資訊 + 你對酒類嘅一般知識判斷,唔可以捏造精確年份/批次等你唔肯定嘅資料 —— 唔肯定就將 conf 分數降低,並喺 note 講明邊啲係推斷。
- conf (confidence) 係 0-100 整數,反映你對識別準確度嘅信心。
- vm (value map) 入面 8 個維度全部係 0-100 整數: mv(市場價值) ql(品質) dv(飲用價值) pv(配餐價值) sv(社交/話題價值) gv(送禮價值) cv(收藏價值) sto(保存價值,即現時值唔值得長期存放)。
- rec.primary 只可以係以下其中一個: drink / keep / gift / sell / share / store
- rec.actions 提供 3 個排名行動建議,a 欄位用返上面嘅英文詞(drink/keep/gift/sell/share/store/pair)。
- flavor 6 個維度都係 0-100 整數,反映呢支酒嘅風味特徵強度(唔係品質),用嚟做用戶 Taste DNA 分析: fruit(果香) sweet(甜度) oak(橡木/木桶) smoke(煙燻/泥煤) acid(酸度) body(酒體/濃厚度)。
- 只回傳 JSON,唔好有任何前言、解釋文字或 markdown code fence。

輸出格式(嚴格跟從,所有文字用繁體中文,除咗 category/a 呢啲固定英文值):
{
 "id": {"cat":"wine/whisky/rum/cognac/sake/other 之一(英文)","producer":"","name":"","vintage":"","region":"","abv":"","vol":"","conf":0,"note":""},
 "vm": {"mv":0,"ql":0,"dv":0,"pv":0,"sv":0,"gv":0,"cv":0,"sto":0},
 "flavor": {"fruit":0,"sweet":0,"oak":0,"smoke":0,"acid":0,"body":0},
 "rec": {"primary":"","reason":"","actions":[{"a":"","reason":""},{"a":"","reason":""},{"a":"","reason":""}]},
 "storage": {"unopened":"","opened":""},
 "pairing": ["","",""]
}`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: mediaType, data: base64Data } },
            { type: "text", text: prompt }
          ]
        }]
      })
    });

    if(!response.ok){
      throw new Error('API request failed: ' + response.status);
    }

    const data = await response.json();
    const textBlock = (data.content || []).map(b => b.text || '').join('\n');
    const clean = textBlock.replace(/```json/g,'').replace(/```/g,'').trim();
    const parsed = JSON.parse(clean);

    clearInterval(loadingInterval);
    currentScan = { raw: parsed, image: dataUrl, scannedAt: Date.now() };
    renderResult(currentScan);

  }catch(err){
    clearInterval(loadingInterval);
    console.error(err);
    renderScanError(dataUrl);
  }
}

  if(conf >= 80) return {cls:'seal-high', label:'high'};
  if(conf >= 55) return {cls:'seal-medium', label:'medium'};
  return {cls:'seal-low', label:'low'};
}

function renderRadar(vm){
  const order = ['mv','ql','dv','pv','sv','gv','cv','sto'];
  const cx = 130, cy = 130, R = 95;
  const n = order.length;
  const points = order.map((k,i)=>{
    const angle = (Math.PI*2*i/n) - Math.PI/2;
    const val = Math.max(0, Math.min(100, vm[k] || 0));
    const r = (val/100) * R;
    return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)];
  });
  const axisPoints = order.map((k,i)=>{
    const angle = (Math.PI*2*i/n) - Math.PI/2;
    return [cx + R*Math.cos(angle), cy + R*Math.sin(angle)];
  });
  const labelPoints = order.map((k,i)=>{
    const angle = (Math.PI*2*i/n) - Math.PI/2;
    return [cx + (R+18)*Math.cos(angle), cy + (R+18)*Math.sin(angle)];
  });

  const polygon = points.map(p=>p.join(',')).join(' ');
  const rings = [0.25,0.5,0.75,1].map(f=>{
    const ringPts = order.map((k,i)=>{
      const angle = (Math.PI*2*i/n) - Math.PI/2;
      return [cx + R*f*Math.cos(angle), cy + R*f*Math.sin(angle)].join(',');
    }).join(' ');
    return `<polygon points="${ringPts}" fill="none" stroke="#34382A" stroke-width="1"/>`;
  }).join('');
  const axes = axisPoints.map(p=>`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#34382A" stroke-width="1"/>`).join('');

  const legend = order.map(k=>`
    <div class="legend-row"><span class="dim">${DIM_LABELS[k]}</span><span class="val">${vm[k] ?? '—'}</span></div>
  `).join('');

  return `
    <div class="radar-wrap">
      <h3>Bottle Value Map</h3>
      <svg width="260" height="260" viewBox="0 0 260 260">
        ${rings}
        ${axes}
        <polygon points="${polygon}" fill="rgba(201,162,75,0.28)" stroke="#C9A24B" stroke-width="2"/>
        ${points.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#C9A24B"/>`).join('')}
      </svg>
      <div class="radar-legend">${legend}</div>
    </div>
  `;
}

/* ---------------- Add to cellar ---------------- */
async function addToCellar(){
  if(!currentScan) return;
  const item = {
    id: 'b_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    status: 'unopened',
    addedAt: Date.now(),
    image: currentScan.image,
    identification: mapId(currentScan.raw.id),
    scan: currentScan.raw
  };
  cellar.unshift(item);
  await saveCellar();

  if(settings.shareCellar){
    try{
      const communityEntry = {
        anonId: getAnonId(),
        category: item.identification.category,
        name: item.identification.name,
        region: item.identification.region,
        vintage: item.identification.vintage,
        flavor: (item.scan && item.scan.flavor) || null,
        addedAt: item.addedAt
      };
      await window.storage.set('community:' + item.id, JSON.stringify(communityEntry), true);
    }catch(e){ console.error('community share failed', e); }
  }

  renderDetail(item.id, true);
}

function getAnonId(){
  // Session-only anonymous identifier (kept in memory, not persisted to any browser storage)
  if(!window.__anonId){
    window.__anonId = 'drinker_' + Math.random().toString(36).slice(2,7);
  }
  return window.__anonId;
}

function mapId(id){
  id = id || {};
  return { name: id.name, producer: id.producer, category: id.cat, vintage: id.vintage, region: id.region };
}

/* ---------------- Taste DNA ---------------- */
function computeTasteDNA(){
  const rated = cellar.filter(b => b.personalRating && b.scan && b.scan.flavor);
  if(!rated.length) return null;
  const keys = Object.keys(FLAVOR_LABELS);
  const totals = {}; let weightSum = 0;
  keys.forEach(k => totals[k] = 0);
  rated.forEach(b=>{
    const w = b.personalRating; // higher rating = more influence on taste profile
    keys.forEach(k=>{ totals[k] += (b.scan.flavor[k]||0) * w; });
    weightSum += w;
  });
  const profile = {};
  keys.forEach(k => profile[k] = Math.round(totals[k]/weightSum));
  return { profile, sampleCount: rated.length };
}

function renderTasteDNA(){
  const dna = computeTasteDNA();
  document.getElementById('main').innerHTML = `
    <div class="view">
      <div class="back-row" onclick="goHome()">← 返回</div>
      <div class="section-head" style="margin-top:6px;"><h2>Your Taste DNA</h2></div>
      ${dna ? `
        <div class="info-block">
          <div class="storage-desc">基於 ${dna.sampleCount} 支已評分酒款計算出嚟嘅個人風味傾向。</div>
        </div>
        ${renderFlavorBars(dna.profile)}
      ` : `
        <div class="empty-state">評分至少一支酒之後,呢度就會顯示你嘅 Taste DNA。喺酒庫入面揀一支酒,俾個星級評分試下。</div>
      `}
    </div>
  `;
}

function renderFlavorBars(profile){
  const rows = Object.keys(FLAVOR_LABELS).map(k=>{
    const val = profile[k] || 0;
    return `
      <div style="margin-bottom:14px;">
        <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px;">
          <span style="color:var(--text-muted);">${FLAVOR_LABELS[k]}</span>
          <span style="font-family:var(--mono); color:var(--gold);">${val}</span>
        </div>
        <div style="height:6px; background:var(--line); border-radius:999px; overflow:hidden;">
          <div style="height:100%; width:${val}%; background:var(--gold); border-radius:999px;"></div>
        </div>
      </div>
    `;
  }).join('');
  return `<div class="info-block">${rows}</div>`;
}

function flavorSimilarity(a, b){
  if(!a || !b) return null;
  const keys = Object.keys(FLAVOR_LABELS);
  let dot=0, magA=0, magB=0;
  keys.forEach(k=>{
    const va = a[k]||0, vb = b[k]||0;
    dot += va*vb; magA += va*va; magB += vb*vb;
  });
  if(magA===0 || magB===0) return null;
  return Math.round((dot/(Math.sqrt(magA)*Math.sqrt(magB)))*100);
}

/* ---------------- Discover (community, opt-in shared storage) ---------------- */
async function renderDiscover(){
  setActiveNav('nav-discover');
  document.getElementById('main').innerHTML = `
    <div class="view">
      <div class="section-head" style="margin-top:14px;"><h2>Discover</h2></div>
      <div class="loading-text" style="text-align:center; padding:30px 0;">正在載入社群分享嘅酒款...</div>
    </div>
  `;

  if(!settings.shareCellar){
    document.getElementById('main').innerHTML = `
      <div class="view">
        <div class="section-head" style="margin-top:14px;"><h2>Discover</h2></div>
        <div class="empty-state">Discover 顯示其他開咗分享嘅用戶 scan 過嘅酒款。你而家未開啟分享,喺 Settings 開啟「分享部分酒庫」先可以睇同俾人睇到。</div>
        <div class="result-actions"><button class="btn btn-primary btn-block" onclick="renderSettings()">前往 Settings</button></div>
      </div>
    `;
    return;
  }

  let entries = [];
  try{
    const listRes = await window.storage.list('community:', true);
    const keys = (listRes && listRes.keys) || [];
    for(const k of keys.slice(0,30)){
      try{
        const res = await window.storage.get(k, true);
        if(res && res.value) entries.push(JSON.parse(res.value));
      }catch(e){ /* skip missing */ }
    }
  }catch(e){ console.error(e); }

  entries.sort((a,b)=> (b.addedAt||0) - (a.addedAt||0));
  const myDna = computeTasteDNA();

  document.getElementById('main').innerHTML = `
    <div class="view">
      <div class="section-head" style="margin-top:14px;"><h2>Discover</h2><span style="font-family:var(--mono); font-size:11px; color:var(--text-faint);">${entries.length} shared</span></div>
      <div class="info-block" style="margin-bottom:16px;">
        <div class="storage-desc">呢度顯示所有開啟咗「分享部分酒庫」嘅用戶所 Scan 嘅酒款(匿名,只顯示酒款資料,唔顯示個人身份)。</div>
      </div>
      ${entries.length ? entries.map(e=>{
        const sim = myDna ? flavorSimilarity(myDna.profile, e.flavor) : null;
        return `
          <div class="bottle-card" style="cursor:default;">
            <div class="bottle-thumb">${categoryEmoji(e.category)}</div>
            <div class="bottle-info">
              <div class="bottle-name">${escapeHtml(e.name || e.category || '未知酒款')}</div>
              <div class="bottle-sub">${escapeHtml([e.region, e.vintage].filter(Boolean).join(' · ') || '—')} · by ${escapeHtml(e.anonId||'someone')}</div>
            </div>
            ${sim!==null ? `<div class="similarity-badge">${sim}% match</div>` : ''}
          </div>
        `;
      }).join('') : '<div class="empty-state">仲未有人分享。做第一個分享酒庫嘅人啦！</div>'}
    </div>
  `;
}

/* ---------------- Settings ---------------- */
function renderSettings(){
  setActiveNav('');
  document.getElementById('main').innerHTML = `
    <div class="view">
      <div class="back-row" onclick="goHome()">← 返回</div>
      <div class="section-head" style="margin-top:6px;"><h2>Settings</h2></div>

      <div class="toggle-row">
        <div>
          <div class="toggle-title">分享部分酒庫</div>
          <div class="toggle-desc">開啟後,你 Scan 加入酒庫嘅酒款資料(唔包括個人筆記/相片)會匿名分享俾其他用戶,顯示喺 Discover。可隨時關閉。</div>
        </div>
        <label class="switch">
          <input type="checkbox" ${settings.shareCellar?'checked':''} onchange="toggleShare(this.checked)">
          <span class="slider"></span>
        </label>
      </div>

      <div class="section-head"><h2>Your Taste DNA</h2><a onclick="renderTasteDNA()">查看 →</a></div>
      <div class="empty-state" style="padding:16px 0;">評分你飲過嘅酒,建立你嘅個人風味檔案。</div>
    </div>
  `;
}

async function toggleShare(checked){
  settings.shareCellar = checked;
  await saveSettings();
}

/* ---------------- utils ---------------- */
function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ---------------- init ---------------- */
(async function init(){
  await loadCellar();
  await loadSettings();
  goHome();
})();
</script>
